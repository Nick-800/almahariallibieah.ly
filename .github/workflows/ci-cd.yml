name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check & Production Build
        run: npm run build

      - name: Deploy to Server via SSH
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '6934' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "::error::Missing required secrets: SSH_PRIVATE_KEY, SSH_HOST, or SSH_USER"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Stream and extract build directly into public_html
          tar -czf - -C dist . | ssh \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            -p "$SSH_PORT" \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SSH_HOST" \
            "tar -xzf - -C public_html"

          rm -f ~/.ssh/deploy_key
