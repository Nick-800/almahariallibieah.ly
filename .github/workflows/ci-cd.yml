name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check & Production Build
        run: npm run build

      - name: Deploy to Server via SSH
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || '102.213.180.4' }}
          SSH_USER: ${{ secrets.SSH_USER || 'almahar5' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '6934' }}
        run: |
          SSH_HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          SSH_USER=$(echo "$SSH_USER" | tr -d '[:space:]')
          SSH_PORT=$(echo "$SSH_PORT" | tr -d '[:space:]')

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Missing required secret: SSH_PRIVATE_KEY"
            exit 1
          fi

          echo "Checking TCP reachability to $SSH_HOST on port $SSH_PORT..."
          if ! nc -zv -w 10 "$SSH_HOST" "$SSH_PORT"; then
            echo "::error::Firewall Block: Port $SSH_PORT on $SSH_HOST is not reachable from GitHub Actions."
            echo "::notice::Your hosting firewall (CSF/cPHulk) is dropping incoming connections from GitHub Actions cloud IPs."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "Streaming dist archive to public_html..."
          tar -czf - -C dist . | ssh \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -p "$SSH_PORT" \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SSH_HOST" \
            "tar -xzf - -C public_html"

          rm -f ~/.ssh/deploy_key
          echo "Deployment to public_html completed successfully!"
