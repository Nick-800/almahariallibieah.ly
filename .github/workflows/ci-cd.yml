name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check & Production Build
        run: npm run build

      - name: Deploy to Server via FTPS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || '102.213.180.4' }}
          username: ${{ secrets.FTP_USERNAME || 'almahar5' }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: public_html/
          local-dir: ./dist/
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/cgi-bin/**
            **/php.ini
            **/.user.ini
            **/.well-known/**

